{{- $existingSecret := .Values.config.existingSecret | default dict -}}
{{- $existingSecretName := get $existingSecret "name" | default "" -}}
{{- $existingSecretKey := get $existingSecret "key" | default "api-key" -}}
{{- if and $existingSecretName .Values.config.apiKey -}}
{{- fail "config.apiKey and config.existingSecret.name are mutually exclusive: existingSecret wins, so the apiKey value would be silently ignored. Clear whichever one you no longer want." -}}
{{- end -}}
{{- $podAnnotations := deepCopy (.Values.podAnnotations | default dict) -}}
{{- if not $existingSecretName -}}
{{- $_ := set $podAnnotations "checksum/secret" (include (print $.Template.BasePath "/secret.yaml") . | sha256sum) -}}
{{- end -}}
{{- $podLabels := mergeOverwrite (deepCopy (.Values.podLabels | default dict)) (include "tautulli-exporter.labels" . | fromYaml) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tautulli-exporter.fullname" . }}
  labels:
    {{- include "tautulli-exporter.labels" . | nindent 4 }}
spec:
  # A single replica: the exporter polls Tautulli on a timer, so additional
  # replicas only duplicate API load and emit duplicate series. Recreate for
  # the same reason -- a rolling update would briefly run two pollers.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tautulli-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- toYaml $podLabels | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The exporter never calls the Kubernetes API, so no credentials are mounted.
      automountServiceAccountToken: false
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TAUTULLI_URL
              value: {{ required "config.tautulliUrl is required" .Values.config.tautulliUrl | quote }}
            - name: TAUTULLI_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if $existingSecretName }}
                  name: {{ $existingSecretName | quote }}
                  key: {{ $existingSecretKey | quote }}
                  {{- else }}
                  name: {{ include "tautulli-exporter.fullname" . }}
                  key: api-key
                  {{- end }}
            - name: METRICS_PORT
              value: {{ .Values.config.metricsPort | quote }}
            {{- with .Values.goMemLimit }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- if ne (toString .Values.config.logLevel) "" }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- end }}
            {{- if ne (toString .Values.config.scrapeInterval) "" }}
            - name: SCRAPE_INTERVAL
              value: {{ .Values.config.scrapeInterval | quote }}
            {{- end }}
            {{- if ne (toString .Values.config.requestTimeout) "" }}
            - name: REQUEST_TIMEOUT
              value: {{ .Values.config.requestTimeout | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.metricsPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
