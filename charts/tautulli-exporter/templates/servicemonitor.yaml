{{- if .Values.serviceMonitor.enabled }}
{{- $intervalMillis := include "tautulli-exporter.durationMillis" .Values.serviceMonitor.interval | int64 -}}
{{- $timeoutMillis := include "tautulli-exporter.durationMillis" .Values.serviceMonitor.scrapeTimeout | int64 -}}
{{- if gt $timeoutMillis $intervalMillis -}}
{{- fail "serviceMonitor.scrapeTimeout must not exceed serviceMonitor.interval" -}}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tautulli-exporter.fullname" . }}
  labels:
    {{- include "tautulli-exporter.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "tautulli-exporter.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout | quote }}
{{- end }}
