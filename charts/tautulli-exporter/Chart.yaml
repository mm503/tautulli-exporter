apiVersion: v2
name: tautulli-exporter
description: Prometheus exporter for Plex Media Server metrics via the Tautulli API
type: application
home: https://github.com/mm503/tautulli-exporter
icon: https://raw.githubusercontent.com/Tautulli/Tautulli/master/data/interfaces/default/images/logo-circle.png
sources:
  - https://github.com/mm503/tautulli-exporter
maintainers:
  - name: mm503
    url: https://github.com/mm503
keywords:
  - prometheus
  - exporter
  - plex
  - tautulli
  - monitoring

# The chart is released together with the exporter and carries the same
# version. release-please updates every line marked x-release-please-version
# (and the marked block below) in its release PR; see scripts/check-versions.sh.
# appVersion is the image tag deployed by default (image.tag overrides it).
version: 1.1.0 # x-release-please-version
appVersion: "1.1.0" # x-release-please-version
annotations:
  artifacthub.io/license: MIT
  # x-release-please-start-version
  artifacthub.io/images: |
    - name: tautulli-exporter
      image: ghcr.io/mm503/tautulli-exporter:1.1.0
      platforms:
        - linux/amd64
        - linux/arm64
  # x-release-please-end
  # Artifact Hub shows these for the version being released. Replace them
  # (or remove them) in the next release so they do not carry over.
  artifacthub.io/changes: |
    - kind: changed
      description: The chart version now matches the exporter version, so it jumps from 0.2.5 to the exporter release
