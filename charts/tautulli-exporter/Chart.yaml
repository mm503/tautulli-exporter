apiVersion: v2
name: tautulli-exporter
description: Prometheus exporter for Plex Media Server metrics via the Tautulli API
type: application
home: https://github.com/mm503/tautulli-exporter
sources:
  - https://github.com/mm503/tautulli-exporter
keywords:
  - prometheus
  - exporter
  - plex
  - tautulli
  - monitoring

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates. Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.2.1

# This is the version of the exporter image deployed by default (image.tag overrides it).
appVersion: "1.0.0"
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: tautulli-exporter
      image: ghcr.io/mm503/tautulli-exporter:1.0.0
      platforms:
        - linux/amd64
        - linux/arm64
