# Default values for tautulli-exporter.

# Exporter configuration, mapped to the container's environment variables.
config:
  # -- Tautulli server URL, e.g. http://tautulli.media.svc.cluster.local:8181 (required)
  tautulliUrl: ""
  # -- Tautulli API key (Settings -> Web Interface). Stored in a chart-managed Secret.
  # Prefer existingSecret for anything beyond local testing.
  apiKey: ""
  # -- Read the API key from a pre-existing Secret instead of apiKey above.
  # Mutually exclusive with apiKey -- setting both fails the render rather than
  # silently ignoring apiKey. Environment variables do not update in a running
  # pod; restart the Deployment after rotating a key in an existing Secret.
  existingSecret:
    name: ""
    key: api-key
  # -- Port the exporter binds inside the container (METRICS_PORT). This is
  # independent of service.port; the Service targets it by name. Keep it at 1024
  # or above -- the container runs as UID 1000 and cannot bind privileged ports.
  metricsPort: 8000
  # -- Logging level: DEBUG, INFO, WARNING, ERROR. Empty uses the exporter default (INFO).
  logLevel: ""
  # -- Seconds between Tautulli API calls (minimum 5). Empty uses the exporter default (30).
  scrapeInterval: ""
  # -- HTTP request timeout in seconds (minimum 1). Empty uses the exporter default (10).
  # Keep it below scrapeInterval: a scrape runs synchronously in the poll loop,
  # so a timeout at or above the interval stretches the cycle past it. The
  # exporter logs a WARNING at startup if this holds.
  requestTimeout: ""

# -- Soft memory limit for the Go runtime (GOMEMLIMIT). Keep it below
# resources.limits.memory so the GC applies back-pressure on a heap spike
# instead of the kernel OOM-killing the container. Empty leaves it unset.
goMemLimit: 48MiB

# -- Additional environment variables for the exporter container.
extraEnv: []
  # - name: GODEBUG
  #   value: madvdontneed=1

image:
  # -- Image repository. The same image is published to Docker Hub as
  # docker.io/mm404/tautulli-exporter.
  repository: ghcr.io/mm503/tautulli-exporter
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

# The image runs a static binary on scratch as UID 1000, so the strict
# defaults below work out of the box. seccompProfile is required by the
# restricted Pod Security Standard; without it the pod fails admission in
# namespaces enforcing that level.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  # -- Cluster-facing port for the metrics/health endpoints.
  port: 8000

# -- Create a ServiceMonitor for the Prometheus Operator (kube-prometheus-stack).
# Without it, scrape the service directly on /metrics.
serviceMonitor:
  enabled: false
  # -- Prometheus scrape interval; align with config.scrapeInterval. Units must
  # each appear at most once, largest first (e.g. 1m30s), as Prometheus requires.
  interval: 30s
  # -- Must not exceed interval.
  scrapeTimeout: 10s
  # -- Extra labels, e.g. to match the operator's serviceMonitorSelector.
  labels: {}

# Steady-state usage is ~15Mi working set and near-zero CPU. There is no CPU
# limit: the exporter is idle between polls and throttling a latency-sensitive
# scrape handler buys nothing. See goMemLimit above for the memory ceiling.
resources:
  requests:
    cpu: 50m
    memory: 16Mi
  limits:
    memory: 64Mi

# /healthz is liveness, /ready is readiness. /ready reports only whether the
# process can serve /metrics -- Tautulli reachability is exposed as the plex_up
# metric rather than a probe failure, so an upstream outage never removes the
# pod from its Service endpoints.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}

tolerations: []

affinity: {}
