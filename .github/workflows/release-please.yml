name: Release Please

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  DOCKERHUB_IMAGE: docker.io/mm404/tautulli-exporter
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/tautulli-exporter

jobs:
  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Check versions match
        run: scripts/check-versions.sh

      - name: Lint chart
        run: |
          helm lint charts/tautulli-exporter \
            --set config.tautulliUrl=http://tautulli:8181 \
            --set config.apiKey=ci-dummy-key-0000

      - name: Template chart
        run: |
          helm template tautulli-exporter charts/tautulli-exporter \
            --set config.tautulliUrl=http://tautulli:8181 \
            --set config.apiKey=ci-dummy-key-0000 \
            --set serviceMonitor.enabled=true > /dev/null

  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -cover

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-please:
    runs-on: ubuntu-latest
    needs: [build-check, helm-validate]
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker-release:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Strip v prefix from tag
        id: version
        run: echo "version=$(echo '${{ needs.release-please.outputs.tag_name }}' | sed 's/^v//')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: mm404
          password: ${{ secrets.DOCKER_HUB_KEY }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binary-release:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Same flags as the Dockerfile. CGO is off so every target cross-compiles
      # from this runner and the binaries have no libc dependency.
      - name: Build binaries
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="tautulli-exporter_${TAG#v}_${os}_${arch}"
            ext=""
            [ "$os" = windows ] && ext=".exe"
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM=7 \
              go build -trimpath -ldflags="-s -w" -o "dist/$name/tautulli-exporter$ext" .
            cp LICENSE README.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
          done
          cd dist && sha256sum *.tar.gz *.zip > checksums.txt

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber

  helm-release:
    runs-on: ubuntu-latest
    needs: [release-please, docker-release]
    if: needs.release-please.outputs.release_created == 'true'
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Checkout chart repository index
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Check versions match the release
        run: scripts/check-versions.sh "${TAG#v}"

      - name: Install Helm
        uses: azure/setup-helm@v5

      # The chart is attached to the app's GitHub release instead of getting a
      # release of its own. Only index.yaml changes on gh-pages: older entries
      # keep pointing at their tautulli-exporter-0.2.x releases, and
      # artifacthub-repo.yml (Artifact Hub verified publisher) is left alone.
      - name: Package chart and attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir .chart
          helm package charts/tautulli-exporter --destination .chart
          gh release upload "$TAG" .chart/*.tgz --clobber

      - name: Update chart repository index
        run: |
          helm repo index .chart \
            --url "https://github.com/${{ github.repository }}/releases/download/${TAG}" \
            --merge gh-pages/index.yaml
          cp .chart/index.yaml gh-pages/index.yaml
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.yaml
          git commit -m "Release tautulli-exporter chart ${TAG#v}"
          git push origin HEAD:gh-pages
